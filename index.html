<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>Abdullah Rehan | Digital Card</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c0c0c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 22%,#1a1612,#0c0c0c 75%)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#snd{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:9;background:none;border:1px solid #6d5c38;color:#e8d5a3;border-radius:20px;padding:7px 12px;font-size:9px;font-weight:700;letter-spacing:.18em}
#stage{position:absolute;inset:0;perspective:900px;pointer-events:none}
#card{--w:min(88vw,390px);position:absolute;left:50%;top:0;width:var(--w);height:calc(var(--w)*.57);margin:calc(var(--w)*-.285) 0 0 calc(var(--w)/-2);transform-style:preserve-3d;pointer-events:auto;cursor:pointer;touch-action:none;outline:none}
.face{position:absolute;inset:0;border-radius:18px;border:1.5px solid #cdab6a;background:linear-gradient(145deg,#161618,#0b0b0d 55%,#141416);box-shadow:0 20px 45px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face:before,.face:after{content:"";position:absolute;border:1px solid #cdab6a45;pointer-events:none}
.face:before{inset:-6px;border-radius:23px}
.face:after{inset:9px;border-radius:11px}
#card:focus-visible .face{box-shadow:0 0 0 3px #e8d5a3}
.back{transform:rotateY(180deg)}
.back svg{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.shine{position:absolute;inset:0;border-radius:17px;background:conic-gradient(from var(--a,0deg) at 50% 108%,transparent 300deg,#e9dcbc33 328deg,transparent 350deg),conic-gradient(from var(--a,0deg) at 50% 108%,transparent 8deg,#e9dcbc33 32deg,transparent 58deg);transition:opacity .6s}
.open .shine{opacity:.15}
.mono{position:relative;width:46px;height:46px;border-radius:50%;border:1.5px solid #dcc184;display:grid;place-items:center;font:700 17px Georgia,"Times New Roman",serif;color:#e8d29a;margin-bottom:13px}
.mono:after{content:"";position:absolute;inset:3px;border:1px solid #dcc18466;border-radius:50%}
.name{position:relative;font:700 clamp(17px,5.6vw,23px) Georgia,"Times New Roman",serif;letter-spacing:.24em;padding-left:.24em;white-space:nowrap;background:linear-gradient(100deg,#8a6a35 0,#d8bd80 30%,#fff8e6 48%,#d3ad6c 65%,#8a6a35 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s ease-in-out infinite alternate}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.city{position:relative;color:#c9c6c0;font-size:9px;letter-spacing:.55em;padding-left:.55em;margin-top:6px}
#hint{position:absolute;top:63%;width:100%;text-align:center;color:#d5b872;font-size:9.5px;font-weight:700;letter-spacing:.45em;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
#panel{position:absolute;top:calc(max(48px,6%) + env(safe-area-inset-top,0px));width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:5}
.it{opacity:0;visibility:hidden;transform:translateY(190px) scale(.8);filter:blur(5px);transition:transform .8s cubic-bezier(.2,.9,.3,1.15),opacity .5s,filter .6s,visibility .8s}
.open .it{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:var(--d)}
h1{font:italic 400 19px Georgia,"Times New Roman",serif;color:#e3cd97}
.it p{color:#8f8a80;font-size:11.5px;text-align:center;margin-top:5px}
a.btn{display:block;pointer-events:auto;text-decoration:none;color:#fff;font-size:12px;font-weight:700;letter-spacing:.05em;padding:14px 22px;border-radius:30px;border:1px solid #ffffff40}
.open a.btn:active{transform:scale(.95);filter:brightness(1.2);box-shadow:0 0 22px #e8d29a66;transition-delay:0s;transition-duration:.1s}
.wa{background:linear-gradient(100deg,#1c9b47,#13813f)}
.ig{background:linear-gradient(95deg,#7b2fa8,#d62468 55%,#f6953a)}
a.sc{background:#fff700;color:#111}
#stem{width:1px;height:20px;margin-top:6px;background:linear-gradient(transparent,#d5b872,transparent)}
.row{display:flex;gap:10px}
button.btn{pointer-events:auto;cursor:pointer;color:#fff;font:700 12px -apple-system,sans-serif;letter-spacing:.05em;padding:14px 20px;border-radius:30px;border:1px solid #ffffff40}
.np{background:linear-gradient(100deg,#ff7a1a,#e04e00)}.ep{background:linear-gradient(100deg,#00b25a,#00753d)}
.open button.it:active,button.btn:active{transform:scale(.95)}
.btn{position:relative;overflow:hidden;box-shadow:0 6px 18px #0008,inset 0 1px #fff4}
.btn:after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,#fff5,transparent);animation:gl 4s infinite;pointer-events:none}
@keyframes gl{0%,65%{left:-60%}100%{left:140%}}
h1{text-shadow:0 0 18px #d5b87266}
.mono{box-shadow:0 0 18px #dcc18455}
.front{background:repeating-linear-gradient(115deg,#ffffff05 0 1px,transparent 1px 5px),radial-gradient(circle at 50% 35%,#242018,#0b0b0d 70%)}
#pay{position:absolute;inset:0;z-index:12;background:#000b;display:grid;place-items:center;padding:24px}
#pay[hidden]{display:none}
.box{width:100%;max-width:330px;background:#121214;border:1.5px solid #cdab6a;outline:1px solid #cdab6a45;outline-offset:5px;border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
.box h2{font:700 22px Georgia,serif;color:#e8d29a}
.box small{color:#8f8a80;margin-top:10px}
.box b{color:#fff;font-size:20px;letter-spacing:.06em;user-select:text;-webkit-user-select:text}
#copy{background:#cdab6a;color:#111;margin-top:14px;width:100%}#close{background:none;width:100%;margin-top:4px}
.em{background:linear-gradient(100deg,#d93025,#8f1d16)}
@media (max-height:680px){#panel{top:40px;gap:7px}a.btn,button.btn{padding-top:10px;padding-bottom:10px}#stem{display:none}}
@media (prefers-reduced-motion:reduce){.name,#hint,.btn:after{animation:none}.it{transition-duration:.01s}}
/* black gold */
.face,.front{background:radial-gradient(circle at 50% 38%,#1d1a14,#060606 72%)}
.face{border:2.5px solid #e2bd6a;box-shadow:0 0 30px #e2bd6a38,0 22px 50px #000c,inset 0 0 35px #000a}
.face:after{border-width:3px;border-style:double;border-color:#e2bd6a77}
.veins{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;filter:drop-shadow(0 0 4px #ffb83a99);pointer-events:none}
.back .veins{inset:0;width:100%;height:100%}
.sig{position:relative;font:400 58px/1 "Great Vibes","Snell Roundhand",cursive;padding:4px 14px 6px;background:linear-gradient(110deg,#9a7432,#fff1c4 45%,#d4a84f 70%,#f6dc98);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px #000) drop-shadow(0 0 7px #e2bd6a66)}
.flo{position:relative;width:110px;height:12px;margin:-8px 0 7px}
.name{font-size:clamp(15px,4.9vw,21px);letter-spacing:.19em;padding-left:.19em}
h1{font:400 34px "Great Vibes","Snell Roundhand",cursive;background:linear-gradient(100deg,#a8864a,#fff3cf,#c9a45e);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;padding:0 10px}
#panel{gap:8px}
a.btn,button.btn,a.sc{width:min(80vw,300px);text-align:center;padding:11px 12px;color:#f6e7bd;font-family:Georgia,serif;font-size:12.5px;border:1px solid #e2bd6a99;background:linear-gradient(180deg,#1c1a16,#080807)}
.row{gap:8px;width:min(80vw,300px)}.row button.btn{flex:1;width:auto}
a.wa{border-left:5px solid #25d366}a.ig{border-left:5px solid #d62468}a.sc{border-left:5px solid #fff700}a.em{border-left:5px solid #ea4335}
#copy.btn{background:linear-gradient(100deg,#b8934f,#f7e3ac,#b8934f);color:#14100a}
.box{background:linear-gradient(160deg,#1c1a15,#060606)}
#stem{display:none}
@media (max-height:680px){#panel{top:36px;gap:5px}a.btn,button.btn{padding-top:8px;padding-bottom:8px}h1{font-size:27px}.it p{margin-top:0}}
/* plain black metal */
.face,.front{background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 3px),linear-gradient(135deg,#242424,#080808 40%,#151515 65%,#050505)}
.face{border:1px solid #444;box-shadow:inset 0 1px #ffffff30,0 22px 50px #000c}
.face:before,.face:after{display:none}
.eng{position:absolute;inset:0;width:100%;height:100%;border-radius:17px}
.back .eng{inset:0;width:100%;height:100%}
.sig{position:relative;width:132px;height:67px;padding:0;margin:0 0 6px;background:none;filter:drop-shadow(0 1px 1px #000)}
.back .sig{inset:auto;width:150px;height:76px}
.ic{width:17px;height:17px;vertical-align:-4px;margin-right:8px}
.row button.btn[data-p]{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 8px;color:#fff;border:1.5px solid #e2bd6a}
.row button[data-p]:before{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:8px;background:#fff;font:900 11px -apple-system,Arial,sans-serif;letter-spacing:0;box-shadow:0 1px 4px #0006}
.row button[data-p="Meezan"]{background:linear-gradient(135deg,#7a1f5c,#3d0b2e)}.row button[data-p="Meezan"]:before{content:"M";color:#6d1851;font-size:15px}
.row button[data-p="HBL"]{background:linear-gradient(135deg,#009b82,#00574a)}.row button[data-p="HBL"]:before{content:"HBL";color:#007a66;font-size:10px}
.row button[data-p="Digitt+"]{background:linear-gradient(135deg,#2563d9,#10245f)}.row button[data-p="Digitt+"]:before{content:"D+";color:#1d47a8;font-size:13px;border-radius:50%}
.row button[data-p="UPaisa"]{background:linear-gradient(135deg,#f58220,#a83f00)}.row button[data-p="UPaisa"]:before{content:"U";color:#e06500;font-size:16px;border-radius:50%}

let ac,on=true,ti=0;const buf={};
const C=window.AudioContext||window.webkitAudioContext;
function audio(){if(!on||!C)return false;
 if(!ac){try{navigator.audioSession.type='playback'}catch(e){}ac=new C();
  for(const k in SND){const u=Uint8Array.from(atob(SND[k]),c=>c.charCodeAt(0));buf[k]=new Promise((ok,no)=>ac.decodeAudioData(u.buffer,ok,no))}}
 if(ac.state!=='running')ac.resume();return true}
function play(k){if(!audio())return;buf[k].then(b=>{const n=ac.createBufferSource();n.buffer=b;const v=ac.createGain(),c=ac.createDynamicsCompressor();v.gain.value=1.6;c.threshold.value=-6;c.ratio.value=12;n.connect(v).connect(c).connect(ac.destination);n.start()})}
const tick=()=>play('t'+(ti++%6)),thud=()=>play('thud');
$('#snd').onclick=e=>{on=!on;e.target.textContent='SOUND: '+(on?'ON':'OFF');if(on)play('ig');else if(ac)ac.suspend()};
document.querySelectorAll('a.btn').forEach(a=>a.addEventListener('click',()=>play(a.dataset.s)));
const pay=$('#pay'),copy=$('#copy');
document.querySelectorAll('[data-p]').forEach(o=>o.onclick=()=>{play(o.dataset.s);$('#pt').textContent=o.dataset.p;$('#num').textContent=o.dataset.n;copy.textContent='Copy number';pay.hidden=false});
$('#close').onclick=()=>{play('sc');pay.hidden=true};
pay.onclick=e=>{if(e.target===pay)pay.hidden=true};
copy.onclick=()=>{play('wa');const n=$('#num'),fail=()=>{getSelection().selectAllChildren(n);copy.textContent='Press and hold the number to copy'};
 try{navigator.clipboard.writeText(n.textContent).then(()=>copy.textContent='Number copied',fail)}catch(e){fail()}};
/* card motion */
let W,H,open=false,openAt=0,drag=null,restY=0,rx=0,ry=0,y=0,s=1,lastTick=0,acc=0;
function size(){W=app.clientWidth;H=app.clientHeight;const r=Math.min(devicePixelRatio||1,2);cv.width=W*r;cv.height=H*r;g.setTransform(r,0,0,r,0,0)}
addEventListener('resize',size);size();y=H*.45;
function activate(){
 if(!open){open=true;openAt=performance.now();app.classList.add('open');$('#hint').hidden=true;play('open')}
 else{restY+=180;tick();setTimeout(thud,450)}}
card.addEventListener('pointerdown',e=>{card.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};audio()});
card.addEventListener('pointermove',e=>{if(!drag)return;
 if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;
 if(drag.moved&&open){const dx=e.clientX-drag.px,dy=e.clientY-drag.py;ry+=dx*.8;rx-=dy*.5;acc+=Math.abs(dx)+Math.abs(dy);
  if(acc>14&&performance.now()-lastTick>112){tick();acc=0;lastTick=performance.now()}}
 drag.px=e.clientX;drag.py=e.clientY});
card.addEventListener('pointerup',()=>{if(!drag)return;const m=drag.moved;drag=null;if(!m)activate();else if(open){restY=Math.round(ry/180)*180;thud()}});
card.addEventListener('pointercancel',()=>{drag=null;restY=Math.round(ry/180)*180});
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}});
/* dust + light rays */
const dust=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,v:Math.random()*.00025+.00005,a:Math.random()*.4+.1}));
function frame(now){
 g.clearRect(0,0,W,H);
 for(const d of dust){d.y-=d.v;if(d.y<0)d.y=1;g.fillStyle=`rgba(220,195,135,${d.a*(.7+.3*Math.sin(now/700+d.x*20))})`;g.beginPath();g.arc(d.x*W+Math.sin(now/2000+d.y*9)*6,d.y*H,d.r,0,7);g.fill()}
 const ty=open?Math.max(H*.82,$('#panel').offsetTop+$('#panel').offsetHeight+62):H*.45,ts=open?.84:1;
 y+=(ty-y)*.07;s+=(ts-s)*.07;
 if(!drag){const tx=open?58:Math.sin(now/1300)*4,tyy=open?restY+Math.sin(now/1700)*3:Math.sin(now/1700)*7;rx+=(tx-rx)*.09;ry+=(tyy-ry)*.08}
 card.style.transform=`translateY(${y}px) scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg)`;
 card.style.setProperty('--a',Math.sin(now/1800)*14+'deg');
 const t=(now-openAt)/1000;
 if(open&&t<4.2){const k=Math.min(1,t/.6)*Math.min(1,(4.2-t)/1.2),cx=W/2,cy=y+8,L=H*.62;
  g.save();g.globalCompositeOperation='lighter';g.lineCap='round';
  [-62,-48,-31,-15,0,15,31,48,62].forEach((deg,i)=>{const a=deg*Math.PI/180,l=L*Math.min(1,t/.9)*(.92+.08*Math.sin(now/300+i)),ex=cx+Math.sin(a)*l,ey=cy-Math.cos(a)*l,gr=g.createLinearGradient(cx,cy,ex,ey);
   gr.addColorStop(0,`rgba(255,232,170,${.75*k})`);gr.addColorStop(1,'rgba(220,185,110,0)');g.strokeStyle=gr;
   for(const w of [9,2.5]){g.globalAlpha=w>3?.25:1;g.lineWidth=w;g.beginPath();g.moveTo(cx,cy);g.lineTo(ex,ey);g.stroke()}});
  g.globalAlpha=1;const r=g.createRadialGradient(cx,cy,0,cx,cy,75);r.addColorStop(0,`rgba(255,240,195,${.95*k})`);r.addColorStop(.25,`rgba(230,195,120,${.4*k})`);r.addColorStop(1,'rgba(230,195,120,0)');g.fillStyle=r;g.fillRect(cx-75,cy-75,150,150);g.restore()}
 /* canvas sits above card only while rays shine */
 cv.style.zIndex=open&&t<4.2?2:0;
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
